id: test-driven-development-red-green-001
name: Complete a RED-GREEN-REFACTOR cycle
description: Verify that a small behavior change starts with a meaningful failing test.
tags:
  - positive
  - red-green-refactor
inputs:
  prompt: |
    Use test-driven-development to implement the behavior described in the local
    change request. Work only in the supplied fixture. Add one focused test,
    run it and record the meaningful RED failure before changing the implementation,
    then make the smallest GREEN change and run the relevant checks.
  files:
    - path: change-request.md
    - path: target.js
graders:
  - type: text
    name: tdd_cycle
    config:
      regex_match:
        - '(?i)red'
        - '(?i)green'
        - '(?i)test'
        - '(?i)failure|failed'
        - '(?i)minimal|smallest'
