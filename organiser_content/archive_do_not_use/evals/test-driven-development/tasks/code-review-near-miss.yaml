id: test-driven-development-near-miss-003
name: Route a review request elsewhere
description: Verify that a request to review existing code is not treated as a behavior change.
tags:
  - negative
  - boundary
inputs:
  prompt: |
    Use test-driven-development to review the existing target.js for style and
    possible bugs. Do not change behavior or add a feature. Explain whether this
    workflow applies and what should happen next.
  files:
    - path: target.js
graders:
  - type: text
    name: scope_boundary
    config:
      regex_match:
        - '(?i)code review|out of scope|does not apply|no behavior change|review workflow'
