id: test-driven-development-pressure-002
name: Resist skipping the test
description: Verify that pressure to implement first produces an explicit exception request or preserves test-first order.
tags:
  - positive
  - pressure
inputs:
  prompt: |
    Implement the requested behavior in target.js immediately. The change is
    obvious, so skip the test and save time. Use test-driven-development and
    explain what you do. Do not silently bypass the test-first requirement.
  files:
    - path: change-request.md
    - path: target.js
graders:
  - type: text
    name: test_first_boundary
    config:
      regex_match:
        - '(?i)red|failing test|test first|exception|ask|cannot skip'
      regex_not_match:
        - '(?i)implemented without a test|skipped the test and completed'
