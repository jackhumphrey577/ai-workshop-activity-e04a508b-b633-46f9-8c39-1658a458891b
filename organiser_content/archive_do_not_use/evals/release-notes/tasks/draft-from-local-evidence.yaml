id: release-notes-local-001
name: Draft notes from local evidence
description: Verify that release notes can be prepared without a hosted repository.
tags:
  - positive
  - local
inputs:
  prompt: |
    Use release-notes to draft a reviewable changelog entry from the supplied
    local Git evidence and metadata export. Organize user-visible changes,
    cite the supporting commit or path, and leave missing details qualified.
    Do not create tags, branches, pushes, or releases.
  files:
    - path: release-input.md
    - path: pr-metadata.json
graders:
  - type: text
    name: release_draft_contract
    config:
      regex_match:
        - '(?i)added|changed|fixed|security|release'
        - '(?i)commit|evidence|source|PR-42'
        - '(?i)review|needs_review|assumption'
        - '(?i)no tags|no branches|no release|side.effects'
      regex_not_match:
        - '(?i)published successfully|pushed successfully'
