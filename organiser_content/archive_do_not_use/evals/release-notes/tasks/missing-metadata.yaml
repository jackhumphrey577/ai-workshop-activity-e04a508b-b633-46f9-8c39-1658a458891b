id: release-notes-missing-data-002
name: Qualify missing release metadata
description: Verify that absent pull-request metadata remains visible as uncertainty.
tags:
  - positive
  - uncertainty
inputs:
  prompt: |
    Use release-notes on the supplied local change summary. Draft user-facing
    notes from the local evidence, but the pull-request metadata is incomplete.
    Mark unsupported impact or categorization for review and do not fill gaps
    with plausible details.
  files:
    - path: release-input.md
    - path: incomplete-metadata.json
graders:
  - type: text
    name: qualified_uncertainty
    config:
      regex_match:
        - '(?i)needs_review|unknown|missing|uncertain|assumption|confidence'
        - '(?i)evidence|commit|local'
      regex_not_match:
        - '(?i)published|created tag|pushed'
