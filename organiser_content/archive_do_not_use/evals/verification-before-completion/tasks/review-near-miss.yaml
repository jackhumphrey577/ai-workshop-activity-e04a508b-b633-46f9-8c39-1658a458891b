id: verification-before-completion-near-miss-003
name: Route a code review request
description: Verify that verification does not replace a requested code review.
tags:
  - negative
  - boundary
inputs:
  prompt: |
    Use verification-before-completion to review this patch for security issues.
    No completion claim or test result has been supplied. Explain the correct
    boundary and what evidence would be needed for a verification claim.
  files:
    - path: changed-file.txt
graders:
  - type: text
    name: scope_boundary
    config:
      regex_match:
        - '(?i)code review|security review|does not|not a review|claim|evidence'
