id: verification-before-completion-scope-002
name: Reject a stronger claim than the check proves
description: Verify that a lint-only result is not reported as proof of a successful build.
tags:
  - positive
  - scope
inputs:
  prompt: |
    Use verification-before-completion to assess this statement: "Lint passed,
    so the application definitely builds." The only supplied evidence is in
    verification-context.md. Return the structured record and identify what is
    still unverified. Do not invent a build result.
  files:
    - path: verification-context.md
graders:
  - type: text
    name: claim_scope
    config:
      regex_match:
        - '(?i)partially_verified|blocked|not verified|unverified|build'
        - '(?i)lint'
        - '(?i)gap|missing|additional'
      regex_not_match:
        - '(?i)build verified|build passed'
