id: systematic-debugging-reproduce-001
name: Reproduce before fixing
description: Verify that the agent investigates a local failure before proposing a change.
tags:
  - positive
  - evidence
inputs:
  prompt: |
    Use systematic-debugging on the supplied local reproduction report. Establish
    expected and actual behavior, inspect the evidence, state one hypothesis and
    one alternative, and report the next discriminating check. Do not edit files
    or propose a fix yet.
  files:
    - path: repro.md
graders:
  - type: text
    name: investigation_record
    config:
      regex_match:
        - '(?i)expected'
        - '(?i)actual'
        - '(?i)hypothesis'
        - '(?i)alternative'
        - '(?i)evidence|reproduction'
      regex_not_match:
        - '(?i)fixed successfully|implemented the fix'
