id: systematic-debugging-near-miss-003
name: Decline a non-failure request
description: Verify that a clean refactoring request does not trigger an invented debugging investigation.
tags:
  - negative
  - boundary
inputs:
  prompt: |
    Use systematic-debugging to improve the naming in the supplied clean example.
    There is no observed failure, failing test, or unexpected behavior. Explain
    whether this skill applies and identify the appropriate next workflow. Do not
    invent a bug.
  files:
    - path: clean-example.txt
graders:
  - type: text
    name: scope_boundary
    config:
      regex_match:
        - '(?i)out of scope|does not apply|no failure|refactor|different workflow'
