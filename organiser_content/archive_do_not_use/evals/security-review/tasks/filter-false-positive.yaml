id: security-review-false-positive-002
name: Distinguish a safe pattern from a vulnerability
description: Verify that the reviewer does not report a vulnerability from a matching name alone.
tags:
  - positive
  - false-positive
inputs:
  prompt: |
    Use security-review on safe-pattern.js only. Determine whether the apparent
    security signal is actually exploitable from the supplied code. Report a
    finding only if the evidence supports one; otherwise explain the limitation
    and say what was checked. Do not modify the file.
  files:
    - path: safe-pattern.js
graders:
  - type: text
    name: self_verification
    config:
      regex_match:
        - '(?i)confidence|evidence|checked|scope|finding|no actionable'
        - '(?i)read-only|no files changed'
