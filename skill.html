<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI Agent Skills Workshop activity template.">
    <title>Skill Template | AI Agent Skills Workshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="skill-page">
    <header class="skill-header">
      <a class="back-link" href="index.html" aria-label="Back to all skill templates"><span aria-hidden="true">&larr;</span> All skills</a>
      <p class="eyebrow">AI Agent Skills Workshop</p>
    </header>

    <main class="skill-layout">
      <section class="template-panel" aria-labelledby="template-title">
        <div class="template-heading">
          <p class="eyebrow">Template markdown</p>
          <h1 id="template-title">Loading template...</h1>
        </div>
        <section class="brief-panel" aria-labelledby="brief-title">
          <h2 id="brief-title">Brief</h2>
          <p id="brief-content"></p>
          <h3>supplementory_material_location</h3>
          <p id="supplementory-material-location"></p>
        </section>
        <div id="template-content" class="markdown-body" aria-live="polite"></div>
      </section>

      <aside class="tips-panel" aria-labelledby="tips-title">
        <div class="tips-heading">
          <p class="eyebrow">Workshop notes</p>
          <h2 id="tips-title">Hints &amp; tips</h2>
        </div>
        <div id="tips-content"></div>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
